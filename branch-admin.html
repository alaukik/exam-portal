<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Branch Admin — Exam Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    /* ── Two-panel layout ── */
    .exam-layout { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 56px); }
    .exam-list-panel { border-right:1px solid var(--border); overflow-y:auto; background:var(--white); height:calc(100vh - 56px); position:sticky; top:56px; }
    .exam-detail-panel { overflow-y:auto; background:var(--bg); padding:20px; }

    /* ── Exam list ── */
    .exam-list-header { padding:12px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--white); z-index:10; }
    .exam-search { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; outline:none; }
    .exam-search:focus { border-color:var(--navy); }
    .exam-filters { display:flex; gap:5px; margin-top:7px; flex-wrap:wrap; }
    .exam-filters select { flex:1; min-width:80px; padding:4px 6px; border:1px solid var(--border); border-radius:5px; font-size:11.5px; font-family:inherit; color:var(--text); background:var(--white); outline:none; }
    .exam-count { font-size:11px; color:var(--text-sub); margin-top:5px; }

    .exam-item { padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.1s; }
    .exam-item:hover { background:var(--grey-light); }
    .exam-item.selected { background:var(--navy-light); border-left:3px solid var(--navy); padding-left:11px; }
    .exam-item-subject { font-size:13px; font-weight:600; color:var(--text); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .exam-item-meta { font-size:11.5px; color:var(--text-sub); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .exam-item-date { font-size:11px; color:var(--text-sub); margin-top:3px; }

    /* ── Detail panel ── */
    .detail-placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; height:60vh; color:var(--text-sub); text-align:center; }
    .detail-placeholder .material-symbols-outlined { font-size:44px; color:var(--border); margin-bottom:10px; }

    /* ── Exam header ── */
    .exam-detail-header { background:var(--white); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
    .exam-detail-title { font-size:16px; font-weight:700; color:var(--text); margin:0 0 7px; }
    .exam-meta-row { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-sub); }
    .exam-meta-row span { display:flex; align-items:center; gap:3px; }
    .exam-meta-row .material-symbols-outlined { font-size:14px; }

    /* ── Section cards ── */
    .section-card { background:var(--white); border:1px solid var(--border); border-radius:8px; margin-bottom:12px; }
    .section-header { padding:11px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .section-title { font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:5px; margin:0; }
    .section-title .material-symbols-outlined { font-size:16px; color:var(--navy); }
    .section-body { padding:14px 16px; }

    /* ── Form grids ── */
    .fg3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .fg2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

    /* ── Batch rows ── */
    .batch-card { background:var(--grey-light); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:10px; }
    .batch-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .batch-label { font-size:12px; font-weight:600; color:var(--navy); }
    .due-badge { font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--border); background:var(--white); color:var(--text-sub); }
    .due-badge.overdue { color:var(--red); border-color:var(--red); background:var(--red-light); }

    /* ── Supervisor chips ── */
    .sup-chips { display:flex; flex-wrap:wrap; gap:6px; min-height:28px; margin-bottom:10px; }
    .sup-chip { display:inline-flex; align-items:center; gap:3px; padding:3px 8px 3px 10px; background:var(--navy-light); color:var(--navy); border-radius:20px; font-size:12px; font-weight:500; }
    .sup-chip-remove { background:none; border:none; cursor:pointer; color:var(--navy); padding:0; display:flex; align-items:center; margin-left:2px; }
    .sup-chip-remove .material-symbols-outlined { font-size:14px; }

    /* ── Distribution rows ── */
    .dist-row { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:end; margin-bottom:8px; }

    /* ── Readonly display ── */
    .field-display { padding:7px 10px; background:var(--grey-light); border:1px solid var(--border); border-radius:6px; font-size:13px; color:var(--text-sub); min-height:34px; }
    .field-display.overdue { background:var(--red-light); color:var(--red); border-color:var(--red-light); }

    /* ── Validation ── */
    .val-msg { font-size:12px; padding:7px 10px; border-radius:5px; margin-top:8px; }
    .val-msg.err { background:var(--red-light); color:var(--red); }
    .val-msg.ok  { background:var(--green-light); color:var(--green); }

    /* ── Responsive ── */
    @media(max-width:860px) {
      .exam-layout { grid-template-columns:1fr; }
      .exam-list-panel { height:280px; position:relative; top:0; border-right:none; border-bottom:1px solid var(--border); }
      .fg3 { grid-template-columns:1fr 1fr; }
    }
    @media(max-width:540px) {
      .fg3, .fg2 { grid-template-columns:1fr; }
      .exam-detail-panel { padding:12px; }
      .dist-row { grid-template-columns:1fr 1fr; }
      .dist-row > div:last-child { grid-column:span 2; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-title">
      <span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:5px">school</span>
      Exam Portal
    </div>
    <div class="brand-sub" id="branchLabel">Branch Admin</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active">
      <span class="material-symbols-outlined">quiz</span> Exams
    </div>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebarAvatar">BA</div>
      <div class="sidebar-user-info">
        <div class="user-name" id="sidebarName">Loading...</div>
        <div class="user-role">Branch Admin</div>
      </div>
    </div>
    <button class="btn btn-outline btn-sm" style="width:100%;margin-top:10px" onclick="authLogout()">
      <span class="material-symbols-outlined">logout</span> Sign out
    </button>
  </div>
</aside>

<!-- Main content -->
<div class="main-content">
  <header class="topbar">
    <div class="topbar-title">Exam Entry</div>
    <div class="topbar-right">
      <div class="btn-icon" onclick="loadExams()" title="Refresh list">
        <span class="material-symbols-outlined">refresh</span>
      </div>
    </div>
  </header>

  <div class="exam-layout">

    <!-- LEFT PANEL: Exam list -->
    <div class="exam-list-panel">
      <div class="exam-list-header">
        <input class="exam-search" type="text" id="examSearch" placeholder="Search subject..." oninput="filterExams()"/>
        <div class="exam-filters">
          <select id="fStd" onchange="filterExams()">
            <option value="">All Std</option>
            <option value="7">Std 7</option>
            <option value="8">Std 8</option>
            <option value="9">Std 9</option>
            <option value="10">Std 10</option>
          </select>
          <select id="fMed" onchange="filterExams()">
            <option value="">All Medium</option>
            <option value="CB">CBSE</option>
            <option value="IC">ICSE</option>
            <option value="EM">SSC EM</option>
            <option value="SE">SSC SE</option>
          </select>
        </div>
        <div class="exam-count" id="examCount"></div>
      </div>
      <div id="examListBody">
        <div class="empty-state">
          <span class="material-symbols-outlined">hourglass_empty</span>
          <p>Loading exams...</p>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Exam detail -->
    <div class="exam-detail-panel" id="detailPanel">
      <div class="detail-placeholder">
        <span class="material-symbols-outlined">touch_app</span>
        <p style="font-weight:600;color:var(--text);margin:0 0 4px">Select an exam</p>
        <p style="font-size:12px;margin:0">Click any exam from the list to enter details</p>
      </div>
    </div>

  </div>
</div>

<!-- Mobile nav -->
<nav class="mobile-nav">
  <div class="mobile-nav-items">
    <div class="mobile-nav-item active">
      <span class="material-symbols-outlined">quiz</span>
      <span>Exams</span>
    </div>
  </div>
</nav>

<!-- Toast -->
<div id="toast-container"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-helpers.js"></script>

<script>
// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
let me           = null;   // current user profile
let allExams     = [];     // all exams from DB
let filtered     = [];     // filtered exam list
let selectedId   = null;   // currently open exam id
let detail       = null;   // full exam detail object
let supervisors  = [];     // master list
let correctors   = [];     // master list

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
(async () => {
  try {
    me = await requireRole('branch_admin');
    if (!me) return;

    document.getElementById('sidebarName').textContent  = me.name;
    document.getElementById('branchLabel').textContent  = me.branches?.name || 'Branch';
    document.getElementById('sidebarAvatar').textContent =
      me.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);

    // Load everything in parallel
    [supervisors, correctors] = await Promise.all([
      getSupervisors(true),
      getCorrectors(true),
      loadExams(),
    ]);
  } catch(e) {
    showToast('Failed to load: ' + e.message, 'error');
  }
})();

// ─────────────────────────────────────────────────────────────
// EXAM LIST
// ─────────────────────────────────────────────────────────────
async function loadExams() {
  try {
    allExams = await getExams({});
    // Annotate status on each exam from batch data
    allExams.forEach(e => { e._status = 'pending'; });
    filtered = [...allExams];
    renderList();
  } catch(e) {
    document.getElementById('examListBody').innerHTML =
      `<div class="empty-state"><span class="material-symbols-outlined">error</span><p>Could not load exams</p></div>`;
  }
}

function renderList() {
  const body = document.getElementById('examListBody');
  document.getElementById('examCount').textContent = `${filtered.length} exam${filtered.length!==1?'s':''}`;

  if (!filtered.length) {
    body.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined">search_off</span><p>No exams found</p></div>`;
    return;
  }

  const statusBadge = {
    pending:  ['badge-pending',  'Pending'],
    progress: ['badge-progress', 'In Progress'],
    overdue:  ['badge-overdue',  'Overdue'],
    complete: ['badge-complete', 'Complete'],
  };

  body.innerHTML = filtered.map(e => {
    const [cls, lbl] = statusBadge[e._status] || statusBadge.pending;
    return `
    <div class="exam-item ${selectedId===e.id?'selected':''}" onclick="openExam('${e.id}')">
      <div class="exam-item-subject" title="${e.subject}">${e.subject}</div>
      <div class="exam-item-meta">
        <span>Std ${e.standard}</span>
        <span>${getMediumLabel(e.medium)}</span>
        <span class="badge ${cls}" style="font-size:10px;padding:1px 7px">${lbl}</span>
      </div>
      <div class="exam-item-date">
        <span class="material-symbols-outlined" style="font-size:11px;vertical-align:middle">calendar_today</span>
        ${fmtDate(e.exam_date)} · ${(e.from_time||'').slice(0,5)}–${(e.to_time||'').slice(0,5)}
      </div>
      <div class="exam-item-date" style="margin-top:2px">
        <span class="material-symbols-outlined" style="font-size:11px;vertical-align:middle">tag</span>
        ${e.exam_ref || '—'}
      </div>
      <div class="exam-item-date" style="margin-top:2px;display:flex;gap:10px">
        <span>
          <span class="material-symbols-outlined" style="font-size:11px;vertical-align:middle">groups</span>
          ${e.batch || '—'}
        </span>
        <span>
          <span class="material-symbols-outlined" style="font-size:11px;vertical-align:middle">123</span>
          ${e.marks ? e.marks + ' marks' : '<span style="color:var(--orange)">Marks not set</span>'}
        </span>
      </div>
    </div>`;
  }).join('');
}

function filterExams() {
  const q   = document.getElementById('examSearch').value.toLowerCase();
  const std = document.getElementById('fStd').value;
  const med = document.getElementById('fMed').value;

  filtered = allExams.filter(e => {
    if (q   && !e.subject.toLowerCase().includes(q) && !e.exam_ref.toLowerCase().includes(q)) return false;
    if (std && String(e.standard) !== std) return false;
    if (med && e.medium !== med)           return false;
    return true;
  });
  renderList();
}

// ─────────────────────────────────────────────────────────────
// EXAM DETAIL
// ─────────────────────────────────────────────────────────────
async function openExam(id) {
  selectedId = id;
  renderList();

  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `<div class="detail-placeholder"><span class="material-symbols-outlined" style="animation:spin 0.8s linear infinite;font-size:32px">refresh</span></div>`;

  try {
    detail = await getExamDetail(id);
    renderDetail();
  } catch(e) {
    panel.innerHTML = `<div class="detail-placeholder"><span class="material-symbols-outlined">error</span><p>${e.message}</p></div>`;
  }
}

function renderDetail() {
  const e = detail;
  document.getElementById('detailPanel').innerHTML = `

    <!-- Exam header -->
    <div class="exam-detail-header">
      <div class="exam-detail-title">${e.subject}</div>
      <div class="exam-meta-row">
        <span><span class="material-symbols-outlined">calendar_today</span>${fmtDate(e.exam_date)}</span>
        <span><span class="material-symbols-outlined">schedule</span>${(e.from_time||'').slice(0,5)} – ${(e.to_time||'').slice(0,5)}</span>
        <span><span class="material-symbols-outlined">school</span>Std ${e.standard} · ${getMediumLabel(e.medium)}</span>
        <span><span class="material-symbols-outlined">quiz</span>${e.exam_type||'—'}</span>
        <span><span class="material-symbols-outlined">info</span>${e.erp_status||'—'}</span>
      </div>
    </div>

    <!-- SECTION 1: General details -->
    <div class="section-card" id="sec-general">
      <div class="section-header">
        <h3 class="section-title">
          <span class="material-symbols-outlined">edit_note</span> General Details
        </h3>
        <button class="btn btn-primary btn-sm" id="btnSaveGeneral" onclick="saveGeneral()">
          <span class="material-symbols-outlined">save</span> Save
        </button>
      </div>
      <div class="section-body">
        <div class="fg3">
          <div class="form-group">
            <label>Marks *</label>
            <input type="number" id="f_marks" value="${e.marks||''}" placeholder="e.g. 100" min="1"/>
          </div>
          <div class="form-group">
            <label>Classroom</label>
            <input type="text" id="f_classroom" value="${e.classroom||''}" placeholder="e.g. Room 101"/>
          </div>
          <div class="form-group">
            <label>Students Present</label>
            <input type="number" id="f_students" value="${e.students_present||''}" placeholder="e.g. 30" min="0"/>
          </div>
          <div class="form-group">
            <label>Actual Hours</label>
            <input type="number" id="f_hours" value="${e.actual_hours||''}" placeholder="e.g. 1.5" step="0.5" min="0"/>
          </div>
          <div class="form-group" style="grid-column:span 2">
            <label>Syllabus</label>
            <input type="text" id="f_syllabus" value="${e.syllabus||''}" placeholder="Topics covered"/>
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION 2: Supervisors -->
    <div class="section-card" id="sec-supervisors">
      <div class="section-header">
        <h3 class="section-title">
          <span class="material-symbols-outlined">verified_user</span> Supervisors
        </h3>
      </div>
      <div class="section-body">
        <div class="sup-chips" id="supChips">${buildSupChips()}</div>
        <div class="fg2">
          <div class="form-group" style="margin:0">
            <label>Add Supervisor</label>
            <select id="supSel">${buildSupOptions()}</select>
          </div>
          <div style="display:flex;align-items:flex-end">
            <button class="btn btn-outline btn-sm" onclick="addSup()">
              <span class="material-symbols-outlined">add</span> Add
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION 3: Paper Correctors -->
    <div class="section-card" id="sec-correctors">
      <div class="section-header">
        <h3 class="section-title">
          <span class="material-symbols-outlined">draw</span> Paper Correctors
        </h3>
        <button class="btn btn-primary btn-sm" onclick="addBatch()" ${!e.marks?'disabled title="Save marks first"':''}>
          <span class="material-symbols-outlined">add</span> Add Batch
        </button>
      </div>
      <div class="section-body">
        ${!e.marks?`<div class="alert alert-warning"><span class="material-symbols-outlined">warning</span><div>Enter and save <strong>Marks</strong> in General Details before adding corrector batches.</div></div>`:''}
        <div id="batchContainer">${buildAllBatches()}</div>
        <div id="batchVal"></div>
      </div>
    </div>

  `;
}

// ─────────────────────────────────────────────────────────────
// GENERAL DETAILS
// ─────────────────────────────────────────────────────────────
async function saveGeneral() {
  const marks    = parseInt(document.getElementById('f_marks').value);
  const students = document.getElementById('f_students').value;
  const hours    = document.getElementById('f_hours').value;
  const syllabus = document.getElementById('f_syllabus').value.trim();
  const classroom= document.getElementById('f_classroom').value.trim();

  if (!marks || marks < 1) { showToast('Marks is required', 'error'); return; }

  const btn = document.getElementById('btnSaveGeneral');
  setLoading(btn, true);
  try {
    await updateExam(detail.id, {
      marks,
      classroom:        classroom || null,
      students_present: students ? parseInt(students) : null,
      actual_hours:     hours ? parseFloat(hours) : null,
      syllabus:         syllabus || null,
    });
    showToast('General details saved', 'success');
    detail = await getExamDetail(detail.id);
    renderDetail();
    refreshListStatus();
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }
  setLoading(btn, false, '<span class="material-symbols-outlined">save</span> Save');
}

// ─────────────────────────────────────────────────────────────
// SUPERVISORS
// ─────────────────────────────────────────────────────────────
function buildSupChips() {
  if (!detail.exam_supervisors?.length)
    return `<span style="font-size:12px;color:var(--text-sub)">None assigned yet</span>`;
  return detail.exam_supervisors.map(es => `
    <div class="sup-chip">
      <span class="material-symbols-outlined" style="font-size:13px">person</span>
      ${es.supervisors?.name || ''}
      ${es.classroom ? `<span style="font-size:11px;opacity:0.8">— ${es.classroom}</span>` : ''}
      <button class="sup-chip-remove" onclick="removeSup('${es.id}','${es.supervisors?.name}')">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>`).join('');
}

function buildSupOptions() {
  const assigned = detail.exam_supervisors?.map(es => es.supervisors?.id) || [];
  const available = supervisors.filter(s => !assigned.includes(s.id));
  if (!available.length) return `<option value="">All supervisors assigned</option>`;
  return `<option value="">— Select supervisor —</option>` +
    available.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
}

async function addSup() {
  const supId = document.getElementById('supSel').value;
  if (!supId) { showToast('Select a supervisor first', 'error'); return; }
  try {
    await addExamSupervisor(detail.id, supId);
    showToast('Supervisor added', 'success');
    detail = await getExamDetail(detail.id);
    document.getElementById('supChips').innerHTML = buildSupChips();
    document.getElementById('supSel').innerHTML   = buildSupOptions();
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }
}

async function removeSup(esId, name) {
  if (!confirm(`Remove supervisor "${name}"?`)) return;
  try {
    await removeExamSupervisor(esId);
    showToast('Supervisor removed', 'success');
    detail = await getExamDetail(detail.id);
    document.getElementById('supChips').innerHTML = buildSupChips();
    document.getElementById('supSel').innerHTML   = buildSupOptions();
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }
}

// ─────────────────────────────────────────────────────────────
// CORRECTOR BATCHES
// ─────────────────────────────────────────────────────────────
function buildAllBatches() {
  const batches = detail.corrector_batches || [];
  if (!batches.length)
    return `<div class="empty-state" style="padding:20px">
      <span class="material-symbols-outlined">draw</span>
      <p>No corrector batches yet</p>
      <p style="font-size:11px">Click "Add Batch" above to assign a paper corrector</p>
    </div>`;
  return batches.map((b,i) => buildBatch(b,i)).join('');
}

function buildBatch(b, idx) {
  const sid    = b.id || ('new'+idx);
  const due    = b.due_date || '';
  const od     = due ? daysOverdue(due) : 0;
  const dueCls = od > 0 ? 'overdue' : '';
  const corName= b.correctors?.name || '';
  const dists  = b.distributions || [];

  return `
  <div class="batch-card" id="bc_${sid}">

    <!-- Batch header -->
    <div class="batch-card-header">
      <span class="batch-label">
        <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">draw</span>
        Batch ${idx+1}${corName ? ' — '+corName : ''}
      </span>
      <div style="display:flex;gap:6px;align-items:center">
        ${due ? `<span class="due-badge ${dueCls}">Due: ${fmtDate(due)}${od>0?' ('+od+'d overdue)':''}</span>` : ''}
        ${b.id ? `<button class="btn btn-danger btn-sm" onclick="delBatch('${b.id}')">
          <span class="material-symbols-outlined">delete</span>
        </button>` : ''}
      </div>
    </div>

    <!-- Corrector + Split -->
    <div class="fg2" style="margin-bottom:10px">
      <div class="form-group" style="margin:0">
        <label>Corrector *</label>
        <select id="bc_cor_${sid}">
          <option value="">— Select corrector —</option>
          ${correctors.map(c=>`<option value="${c.id}" ${b.corrector_id===c.id?'selected':''}>${c.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group" style="margin:0">
        <label>Split Type *
          <span style="font-weight:400;color:var(--text-sub);font-size:11px">
            (A=papers split · B=section split)
          </span>
        </label>
        <select id="bc_split_${sid}">
          <option value="A" ${(!b.split_type||b.split_type==='A')?'selected':''}>Type A — Papers split between correctors</option>
          <option value="B" ${b.split_type==='B'?'selected':''}>Type B — Same papers, different sections</option>
        </select>
      </div>
    </div>

    <!-- Papers + Marks + Amount -->
    <div class="fg3" style="margin-bottom:10px">
      <div class="form-group" style="margin:0">
        <label>Papers Sent *</label>
        <input type="number" id="bc_ps_${sid}" value="${b.papers_sent||''}" min="1" placeholder="e.g. 20"
          onchange="liveCalc('${sid}')"/>
      </div>
      <div class="form-group" style="margin:0">
        <label>Section Marks *
          <span style="font-weight:400;color:var(--text-sub);font-size:11px">(max ${detail.marks||'?'})</span>
        </label>
        <input type="number" id="bc_sm_${sid}" value="${b.section_marks||''}" min="1"
          max="${detail.marks||999}" placeholder="e.g. ${detail.marks||100}"
          onchange="liveCalc('${sid}')"/>
      </div>
      <div class="form-group" style="margin:0">
        <label>Remuneration</label>
        <div class="field-display" id="bc_amt_${sid}">
          ${b.papers_received && b.section_marks ? b.papers_received+' × '+b.section_marks+' marks' : '—'}
        </div>
      </div>
    </div>

    <!-- Dates row 1: Sent date + Delivered by + Delivered on -->
    <div class="fg3" style="margin-bottom:10px">
      <div class="form-group" style="margin:0">
        <label>Papers Sent Date *
          <span style="font-weight:400;color:var(--text-sub);font-size:10px">
            (exam date to +5 days)
          </span>
        </label>
        <input type="date" id="bc_sd_${sid}"
          value="${b.sent_date||''}"
          min="${detail.exam_date}"
          max="${addDays(detail.exam_date,5)}"
          onchange="onSentDateChange('${sid}')"/>
      </div>
      <div class="form-group" style="margin:0">
        <label>Delivered By</label>
        <input type="text" id="bc_db_${sid}" value="${b.delivered_by||''}" placeholder="Person's name"/>
      </div>
      <div class="form-group" style="margin:0">
        <label>Delivered On *
          <span style="font-weight:400;color:var(--text-sub);font-size:10px">
            (sent date to +2 days)
          </span>
        </label>
        <input type="date" id="bc_do_${sid}"
          value="${b.delivered_on||''}"
          min="${b.sent_date||detail.exam_date}"
          max="${b.sent_date?addDays(b.sent_date,2):''}"
          onchange="liveCalc('${sid}')"/>
      </div>
    </div>

    <!-- Dates row 2: Due date (auto) + Return date + Papers received -->
    <div class="fg3" style="margin-bottom:10px">
      <div class="form-group" style="margin:0">
        <label>Due Date <span style="font-weight:400;color:var(--green);font-size:10px">auto-calculated</span></label>
        <div class="field-display ${dueCls}" id="bc_due_${sid}">
          ${due ? fmtDate(due) : '—'}
        </div>
      </div>
      <div class="form-group" style="margin:0">
        <label>Return Date</label>
        <input type="date" id="bc_rd_${sid}"
          value="${b.return_date||''}"
          min="${b.delivered_on||''}"
          onchange="liveCalc('${sid}')"/>
      </div>
      <div class="form-group" style="margin:0">
        <label>Papers Received</label>
        <input type="number" id="bc_pr_${sid}" value="${b.papers_received||''}" min="0"
          placeholder="e.g. 20" onchange="liveCalc('${sid}')"/>
      </div>
    </div>

    <!-- Save batch button -->
    <div style="text-align:right">
      <button class="btn btn-primary btn-sm" onclick="saveBatch('${b.id||''}','${idx}','${sid}')">
        <span class="material-symbols-outlined">save</span> Save Batch
      </button>
    </div>

    <!-- Distributions (only for saved batches) -->
    ${b.id ? `
      <hr style="border:none;border-top:1px solid var(--border);margin:12px 0 10px"/>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <label style="margin:0;font-size:12.5px;font-weight:600;text-transform:none;color:var(--text)">
          <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">local_shipping</span>
          Answer Sheet Distributions
        </label>
        <button class="btn btn-outline btn-sm" onclick="addDist('${b.id}')">
          <span class="material-symbols-outlined">add</span> Add
        </button>
      </div>
      <div id="dists_${b.id}">${buildDists(b.id, dists)}</div>
    ` : `<p style="font-size:12px;color:var(--text-sub);margin:10px 0 0;text-align:center">
      Save this batch first, then you can add distributions.
    </p>`}

  </div>`;
}

// ── Live calculations on input change ────────────────────────
function liveCalc(sid) {
  // Update due date preview
  const deliveredOn  = document.getElementById(`bc_do_${sid}`)?.value;
  const sectionMarks = parseInt(document.getElementById(`bc_sm_${sid}`)?.value) || 0;
  const dueEl        = document.getElementById(`bc_due_${sid}`);

  if (dueEl && deliveredOn && sectionMarks) {
    const due = calcDueDate(deliveredOn, sectionMarks);
    const od  = daysOverdue(due);
    dueEl.textContent = fmtDate(due) + (od > 0 ? ` (${od}d overdue)` : '');
    dueEl.className   = 'field-display' + (od > 0 ? ' overdue' : '');
  } else if (dueEl) {
    dueEl.textContent = '—';
    dueEl.className   = 'field-display';
  }

  // Update amount display
  const papersRec = parseInt(document.getElementById(`bc_pr_${sid}`)?.value) || 0;
  const amtEl     = document.getElementById(`bc_amt_${sid}`);
  if (amtEl) {
    amtEl.textContent = (papersRec && sectionMarks) ? `${papersRec} × ${sectionMarks} marks` : '—';
  }
}

// Update delivered date constraints when sent date changes
function onSentDateChange(sid) {
  const sentDate  = document.getElementById(`bc_sd_${sid}`)?.value;
  const doInput   = document.getElementById(`bc_do_${sid}`);
  if (!doInput || !sentDate) return;
  doInput.min = sentDate;
  doInput.max = addDays(sentDate, CONFIG.DATE_RULES.DELIVERED_MAX_DAYS);
  if (doInput.value && doInput.value < sentDate) doInput.value = sentDate;
  liveCalc(sid);
}

// ── Save batch ────────────────────────────────────────────────
async function saveBatch(batchId, idx, sid) {
  const correctorId  = document.getElementById(`bc_cor_${sid}`)?.value;
  const splitType    = document.getElementById(`bc_split_${sid}`)?.value;
  const papersSent   = parseInt(document.getElementById(`bc_ps_${sid}`)?.value);
  const sectionMarks = parseInt(document.getElementById(`bc_sm_${sid}`)?.value);
  const sentDate     = document.getElementById(`bc_sd_${sid}`)?.value;
  const deliveredBy  = document.getElementById(`bc_db_${sid}`)?.value?.trim();
  const deliveredOn  = document.getElementById(`bc_do_${sid}`)?.value;
  const returnDate   = document.getElementById(`bc_rd_${sid}`)?.value;
  const papersRec    = parseInt(document.getElementById(`bc_pr_${sid}`)?.value) || null;

  // Required field checks
  if (!correctorId)  { showToast('Please select a corrector', 'error'); return; }
  if (!papersSent || papersSent < 1) { showToast('Papers sent is required', 'error'); return; }
  if (!sectionMarks || sectionMarks < 1) { showToast('Section marks is required', 'error'); return; }
  if (!sentDate)     { showToast('Papers sent date is required', 'error'); return; }
  if (!deliveredOn)  { showToast('Delivered on date is required', 'error'); return; }

  // Date range checks
  if (!validateSentDate(detail.exam_date, sentDate)) {
    showToast(`Sent date must be between exam date (${fmtDate(detail.exam_date)}) and +5 days`, 'error');
    return;
  }
  if (!validateDeliveredDate(sentDate, deliveredOn)) {
    showToast(`Delivered date must be within 2 days of sent date (${fmtDate(sentDate)})`, 'error');
    return;
  }
  if (returnDate && !validateReturnDate(deliveredOn, returnDate)) {
    showToast('Return date cannot be before delivered date', 'error');
    return;
  }

  // Section marks must not exceed exam marks
  if (detail.marks && sectionMarks > detail.marks) {
    showToast(`Section marks (${sectionMarks}) cannot exceed exam marks (${detail.marks})`, 'error');
    return;
  }

  try {
    await saveCorrectorBatch({
      id:              batchId || undefined,
      exam_id:         detail.id,
      corrector_id:    correctorId,
      split_type:      splitType,
      papers_sent:     papersSent,
      section_marks:   sectionMarks,
      sent_date:       sentDate,
      delivered_by:    deliveredBy || null,
      delivered_on:    deliveredOn,
      return_date:     returnDate || null,
      papers_received: papersRec,
    });

    showToast('Batch saved successfully', 'success');
    detail = await getExamDetail(detail.id);
    document.getElementById('batchContainer').innerHTML = buildAllBatches();
    showBatchValidation();
    refreshListStatus();
  } catch(e) {
    showToast('Error saving batch: ' + e.message, 'error');
  }
}

async function delBatch(batchId) {
  if (!confirm('Delete this corrector batch? All its distributions will also be deleted.')) return;
  try {
    await deleteCorrectorBatch(batchId);
    showToast('Batch deleted', 'success');
    detail = await getExamDetail(detail.id);
    document.getElementById('batchContainer').innerHTML = buildAllBatches();
    showBatchValidation();
    refreshListStatus();
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }
}

// ── Cross-batch validation ────────────────────────────────────
function showBatchValidation() {
  const el      = document.getElementById('batchVal');
  const batches = detail.corrector_batches || [];
  if (!el || batches.length < 2) { if(el) el.innerHTML=''; return; }

  const msgs = [];

  const typeA = batches.filter(b => b.split_type === 'A');
  if (typeA.length > 1 && detail.students_present) {
    const sum = typeA.reduce((s,b)=>s+(b.papers_sent||0),0);
    if (sum !== detail.students_present)
      msgs.push(`Type A: Papers sent total (${sum}) ≠ students present (${detail.students_present})`);
  }

  const typeB = batches.filter(b => b.split_type === 'B');
  if (typeB.length > 1 && detail.marks) {
    const sum = typeB.reduce((s,b)=>s+(b.section_marks||0),0);
    if (sum !== detail.marks)
      msgs.push(`Type B: Section marks total (${sum}) ≠ exam marks (${detail.marks})`);
  }

  if (msgs.length) {
    el.innerHTML = msgs.map(m =>
      `<div class="val-msg err"><span class="material-symbols-outlined" style="font-size:13px;vertical-align:middle">warning</span> ${m}</div>`
    ).join('');
  } else {
    el.innerHTML = `<div class="val-msg ok"><span class="material-symbols-outlined" style="font-size:13px;vertical-align:middle">check_circle</span> Batch totals are valid</div>`;
  }
}

// ─────────────────────────────────────────────────────────────
// DISTRIBUTIONS
// ─────────────────────────────────────────────────────────────
function buildDists(batchId, dists) {
  if (!dists.length)
    return `<div style="font-size:12px;color:var(--text-sub);padding:2px 0">No distributions recorded yet</div>`;

  return dists.map(d => `
    <div class="dist-row" id="dr_${d.id}">
      <div class="form-group" style="margin:0">
        <label>Date</label>
        <input type="date" id="dd_${d.id}" value="${d.distribution_date||''}"
          min="${detail.exam_date}"/>
      </div>
      <div class="form-group" style="margin:0">
        <label>Papers Distributed</label>
        <input type="number" id="dp_${d.id}" value="${d.papers_distributed||''}" min="1"/>
      </div>
      <div style="display:flex;gap:4px;align-items:flex-end;padding-bottom:1px">
        <button class="btn btn-primary btn-sm" onclick="saveDist('${d.id}','${batchId}')">
          <span class="material-symbols-outlined">save</span>
        </button>
        <button class="btn btn-danger btn-sm" onclick="delDist('${d.id}','${batchId}')">
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
    </div>`).join('');
}

function addDist(batchId) {
  const container = document.getElementById(`dists_${batchId}`);
  const tempId    = 'tmp_' + Date.now();

  // Remove "no distributions yet" text
  if (container.querySelector('div:not(.dist-row)')) container.innerHTML = '';

  // Find return date of this batch to use as min
  const batch    = detail.corrector_batches?.find(b => b.id === batchId);
  const minDate  = batch?.return_date || detail.exam_date;

  const row = document.createElement('div');
  row.className = 'dist-row';
  row.id = `dr_${tempId}`;
  row.innerHTML = `
    <div class="form-group" style="margin:0">
      <label>Date</label>
      <input type="date" id="dd_${tempId}" min="${minDate}"/>
    </div>
    <div class="form-group" style="margin:0">
      <label>Papers Distributed</label>
      <input type="number" id="dp_${tempId}" min="1" placeholder="e.g. 20"/>
    </div>
    <div style="display:flex;gap:4px;align-items:flex-end;padding-bottom:1px">
      <button class="btn btn-primary btn-sm" onclick="saveNewDist('${tempId}','${batchId}')">
        <span class="material-symbols-outlined">save</span>
      </button>
      <button class="btn btn-danger btn-sm" onclick="document.getElementById('dr_${tempId}').remove()">
        <span class="material-symbols-outlined">delete</span>
      </button>
    </div>`;
  container.appendChild(row);
}

async function saveNewDist(tempId, batchId) {
  const date   = document.getElementById(`dd_${tempId}`)?.value;
  const papers = parseInt(document.getElementById(`dp_${tempId}`)?.value);
  if (!date)   { showToast('Date is required', 'error'); return; }
  if (!papers) { showToast('Papers distributed is required', 'error'); return; }

  try {
    await saveDistribution({ batch_id: batchId, papers_distributed: papers, distribution_date: date });
    showToast('Distribution saved', 'success');
    detail = await getExamDetail(detail.id);
    const batch = detail.corrector_batches?.find(b => b.id === batchId);
    if (batch) document.getElementById(`dists_${batchId}`).innerHTML = buildDists(batchId, batch.distributions);
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }
}

async function saveDist(distId, batchId) {
  const date   = document.getElementById(`dd_${distId}`)?.value;
  const papers = parseInt(document.getElementById(`dp_${distId}`)?.value);
  if (!date || !papers) { showToast('Date and papers are required', 'error'); return; }
  try {
    await saveDistribution({ id: distId, batch_id: batchId, papers_distributed: papers, distribution_date: date });
    showToast('Distribution updated', 'success');
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }
}

async function delDist(distId, batchId) {
  if (!confirm('Delete this distribution entry?')) return;
  try {
    await deleteDistribution(distId);
    showToast('Distribution deleted', 'success');
    detail = await getExamDetail(detail.id);
    const batch = detail.corrector_batches?.find(b => b.id === batchId);
    if (batch) document.getElementById(`dists_${batchId}`).innerHTML = buildDists(batchId, batch.distributions);
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }
}

// ── Add new empty batch row ───────────────────────────────────
function addBatch() {
  if (!detail.marks) { showToast('Save Marks in General Details first', 'error'); return; }

  const container = document.getElementById('batchContainer');
  // Remove empty state
  const empty = container.querySelector('.empty-state');
  if (empty) empty.parentElement?.removeChild(empty);

  const idx   = detail.corrector_batches?.length || 0;
  const dummy = { id:null, corrector_id:null, split_type:'A', papers_sent:null,
                  section_marks:null, sent_date:null, delivered_by:null,
                  delivered_on:null, return_date:null, papers_received:null,
                  distributions:[], correctors:null, due_date:null, is_overdue:false };

  const wrap = document.createElement('div');
  wrap.innerHTML = buildBatch(dummy, idx);
  container.appendChild(wrap.firstElementChild);
}

// ─────────────────────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────────────────────
function addDays(dateStr, days) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function refreshListStatus() {
  const batches = detail.corrector_batches || [];
  const idx = allExams.findIndex(e => e.id === detail.id);
  if (idx < 0) return;

  if (!batches.length)                          allExams[idx]._status = 'pending';
  else if (batches.some(b => b.is_overdue))     allExams[idx]._status = 'overdue';
  else if (batches.every(b => b.return_date))   allExams[idx]._status = 'complete';
  else                                           allExams[idx]._status = 'progress';

  filterExams();
}
</script>
